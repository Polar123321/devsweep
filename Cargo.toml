[package]
name = "devsweep"
version = "0.1.0"
edition = "2024"
description = "A fast terminal UI that finds and sweeps away node_modules, target/, venvs and other build junk"
license = "MIT"
readme = "README.md"
keywords = ["tui", "cleanup", "disk-space", "node-modules", "cli"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
rayon = "1.12.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
